apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Play Store upload key. android/keystore.properties is git-ignored; see docs/PLAY_STORE.md.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'art.inkstone'
    compileSdk 36
    defaultConfig {
        applicationId 'art.inkstone'
        minSdk 26
        targetSdk 36
        versionCode 38
        versionName '0.25'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            inputs.files(fileTree('../../target/release') {
                include 'libinkstone.dylib', 'libinkstone.so', 'inkstone.dll'
            }).withPropertyName('hostNativeEngine')
            systemProperty 'java.library.path', file('../../target/release').absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'inkstone.artifacts', file('../../artifacts').absolutePath
            if (System.getenv('INKSTONE_TEST_SDK_DIR')) {
                systemProperty 'robolectric.dependency.dir', System.getenv('INKSTONE_TEST_SDK_DIR')
                systemProperty 'robolectric.offline', 'true'
            }
            maxHeapSize = '3g'
        }
    }
}

dependencies {
    implementation files('libs/jcodec-0.2.5.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.robolectric:robolectric:4.17') {
        if (System.getenv('INKSTONE_TEST_RUNTIME')) {
            exclude group: 'org.robolectric', module: 'nativeruntime-dist-compat'
        }
    }
    if (System.getenv('INKSTONE_TEST_RUNTIME')) {
        testRuntimeOnly files(System.getenv('INKSTONE_TEST_RUNTIME'))
    }
}
